[project]
name = "mirofish-backend"
version = "0.1.0"
description = "SimSend (MiroFish) - marketing campaign audience simulation engine"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # Web framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    # Production WSGI server (see wsgi.py / Dockerfile)
    "waitress>=3.0.0",
    
    # LLM
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.13.0",
    
    # OASIS social-media simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # File parsing
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Force CPU-only torch (prevents camel-ai from pulling 2.5GB GPU build)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }